name: Generate audio

# Run from the Actions tab: "Generate audio" -> "Run workflow".
# mode "free": open neural Afrikaans voice (UBC-NLP Simba-TTS, CC BY 4.0) + Whisper quality check.
#              No keys needed, BUT in testing (Nov 2026) only 5 of 40 clips were intelligible to
#              Whisper large-v3, so it is not good enough for the app. Kept for future open models.
# modes "all" / "bakeoff" need repository secrets (Settings -> Secrets and variables -> Actions):
#   AZURE_SPEECH_KEY + AZURE_SPEECH_REGION          (Microsoft Azure AI Speech, af-ZA neural voices)
#   and/or ELEVENLABS_API_KEY + ELEVENLABS_VOICE_FEMALE + ELEVENLABS_VOICE_MALE
#   optional: OPENAI_API_KEY (speech-recognition quality check of every clip)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "free = no keys (Simba-TTS); all = Azure/ElevenLabs with your secrets; bakeoff = compare paid voices"
        type: choice
        options: [all, bakeoff, free, meta-mms]
        default: all
      limit:
        description: "Only the first N texts (0 = all). Handy for a quick test."
        default: "0"
      qa_model:
        description: "Whisper model for the free-mode quality check"
        type: choice
        options: [small, medium, large-v3]
        default: medium

permissions:
  contents: write
  actions: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_FEMALE: ${{ secrets.ELEVENLABS_VOICE_FEMALE }}
      ELEVENLABS_VOICE_MALE: ${{ secrets.ELEVENLABS_VOICE_MALE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run content
      - name: Free neural voice (Simba-TTS) with Whisper quality check
        if: inputs.mode == 'free'
        env:
          AUDIO_LIMIT: ${{ inputs.limit }}
          QA_MODEL: ${{ inputs.qa_model }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q "transformers>=4.40" faster-whisper numpy
          node pipeline/audio/export-texts.mjs
          python pipeline/audio/mms_tts.py
      - name: Meta MMS Afrikaans voice (original checkpoint, CC BY-NC 4.0) with Whisper quality check
        if: inputs.mode == 'meta-mms'
        env:
          AUDIO_LIMIT: ${{ inputs.limit }}
          QA_MODEL: ${{ inputs.qa_model }}
          VOICE_ID: mms
          VOICE_NAME: Meta MMS Afrikaans (neural)
          TTS_MODEL: mms-afr
          TTS_LICENCE: cc-by-nc-4.0
          TTS_SOURCE: https://github.com/facebookresearch/fairseq/tree/main/examples/mms
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q "transformers==4.46.3" faster-whisper numpy
          curl -fsSL -o afr.tar.gz https://dl.fbaipublicfiles.com/mms/tts/afr.tar.gz
          tar xzf afr.tar.gz && ls -la afr
          curl -fsSL -o convert_vits.py https://raw.githubusercontent.com/huggingface/transformers/v4.46.3/src/transformers/models/vits/convert_original_checkpoint.py
          python convert_vits.py --checkpoint_path afr/G_100000.pth --vocab_path afr/vocab.txt --config_path afr/config.json --language afr --pytorch_dump_folder_path mms-afr
          node pipeline/audio/export-texts.mjs
          python pipeline/audio/mms_tts.py
      - name: Generate clips (Azure / ElevenLabs)
        if: inputs.mode != 'free'
        run: |
          if [ "${{ inputs.mode }}" = "bakeoff" ]; then npm run audio:bakeoff; else npm run audio; fi
      - name: Quality check (speech recognition)
        if: inputs.mode != 'free' && env.OPENAI_API_KEY != ''
        run: npm run audio:qa -- --prune
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${{ github.ref_name }}" || true
          rm -rf afr afr.tar.gz mms-afr convert_vits.py
          git add public/audio
          if git diff --cached --quiet; then echo "No new audio"; exit 0; fi
          git commit -m "Add generated audio (${{ inputs.mode }})"
          git push
      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
